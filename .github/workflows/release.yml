name: Build Windows portable release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron runtime
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
          node node_modules/electron/install.js
          if (-not (Test-Path -LiteralPath node_modules/electron/dist/electron.exe)) { throw 'Electron runtime was not downloaded.' }
      - name: Verify
        run: npm run check
      - name: Resolve release tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+$') { $tag = $env:GITHUB_REF_NAME } else { $tag = "v$($package.version)" }
          $tagVersion = [version]($tag.TrimStart('v'))
          $deltaEnabled = $tagVersion -gt [version]'0.2.9'
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLISH_DELTA_MANIFEST=$($deltaEnabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fetch optional YOLO model
        if: ${{ !hashFiles('models/wechat-bubbles.pt') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path models -Force | Out-Null
          gh release download v0.2.0 --repo $env:GITHUB_REPOSITORY --pattern wechat-bubbles.pt --dir models --clobber
      - name: Package portable app
        shell: pwsh
        run: ./scripts/package-portable.ps1 -OutputPath "$env:GITHUB_WORKSPACE/listagent-windows-x64.zip"
      - name: Generate incremental update manifest
        if: ${{ env.PUBLISH_DELTA_MANIFEST == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: ./scripts/create-update-manifest.ps1 -OutputPath "$env:GITHUB_WORKSPACE/listagent-update-manifest.json" -Repository $env:REPOSITORY -Tag $env:RELEASE_TAG
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($env:PUBLISH_DELTA_MANIFEST -eq 'true') {
              gh release upload $env:RELEASE_TAG listagent-windows-x64.zip listagent-update-manifest.json --repo $env:GITHUB_REPOSITORY --clobber
            } else {
              gh release upload $env:RELEASE_TAG listagent-windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber
            }
          } else {
            if ($env:PUBLISH_DELTA_MANIFEST -eq 'true') {
              gh release create $env:RELEASE_TAG listagent-windows-x64.zip listagent-update-manifest.json --repo $env:GITHUB_REPOSITORY --title "listagent $env:RELEASE_TAG" --generate-notes
            } else {
              gh release create $env:RELEASE_TAG listagent-windows-x64.zip --repo $env:GITHUB_REPOSITORY --title "listagent $env:RELEASE_TAG" --generate-notes
            }
          }
      - name: Check Gitee Release configuration
        id: gitee-config
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
        shell: pwsh
        run: |
          $ownerOk = $env:GITEE_OWNER -match '^[A-Za-z0-9_.-]+$'
          $repositoryOk = $env:GITEE_REPOSITORY -match '^[A-Za-z0-9_.-]+$'
          $enabled = -not [string]::IsNullOrWhiteSpace($env:GITEE_TOKEN) -and $ownerOk -and $repositoryOk
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $enabled) { Write-Host 'Gitee Release sync skipped: configure GITEE_TOKEN and GITEE_OWNER/GITEE_REPOSITORY.' }
      - name: Sync Release assets to Gitee
        if: steps.gitee-config.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseName = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json name --jq .name
          $releaseBody = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body
          $files = @("$env:GITHUB_WORKSPACE/listagent-windows-x64.zip")
          if (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE/listagent-update-manifest.json") {
            $files += "$env:GITHUB_WORKSPACE/listagent-update-manifest.json"
          }
          ./scripts/sync-gitee-release.ps1 -Owner $env:GITEE_OWNER -Repository $env:GITEE_REPOSITORY -Tag $env:RELEASE_TAG -Name $releaseName -Body $releaseBody -Files $files
