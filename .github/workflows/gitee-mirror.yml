name: Mirror repository to Gitee

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Gitee mirror configuration
        id: config
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
        shell: bash
        run: |
          if [[ -n "$GITEE_TOKEN" && "$GITEE_OWNER" =~ ^[A-Za-z0-9_.-]+$ && "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Gitee mirror skipped: configure GITEE_TOKEN and GITEE_OWNER/GITEE_REPOSITORY."
          fi

      - name: Push branches and tags to Gitee
        if: steps.config.outputs.enabled == 'true'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' "$GITEE_OWNER" ;;
            *) printf '%s' "$GITEE_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPOSITORY}.git"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push --mirror gitee
          rm -f "$askpass"
